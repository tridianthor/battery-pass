<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Page</title>
    {% load static %}
    {% load bootstrap5 %}
    {% bootstrap_css %}
    {% bootstrap_javascript %}
    <link rel="stylesheet" href="{% static 'css/user.css' %}">
</head>
<body>
    <div class="login-container">
        <h2>Signup</h2>
        <form>
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="username" class="form-control" id="username" placeholder="Username">
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email Address/Username</label>
                <input type="email" class="form-control" id="email" placeholder="Enter email or username">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Password">
            </div>
            <div class="mb-3">
                <label for="confirm_password" class="form-label">Confirm Password</label>
                <input type="confirm_password" class="form-control" id="confirm_password" placeholder="Confirm Password">
            </div>
            
            <div class="button-forgot-container">
                <button type="submit" class="btn btn-primary">Sign Up</button>
            </div>
        </form>
        
        <div class="signup-link mt-4">
            <p>Have an account? <a href="#">Login</a></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
